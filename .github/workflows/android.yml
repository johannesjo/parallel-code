name: Android

# Tests PRs and publishes main builds to Google Play internal testing.
# Pushing an android-v* tag (for example
# android-v0.2.0) also publishes a signed APK as a GitHub release, separate from desktop v* releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # LookPresetsGeneratedTest checks the generated looks against these desktop sources.
      - 'scripts/generate-android-looks.mjs'
      - 'src/styles.css'
      - 'src/lib/look.ts'
      - 'src/lib/theme.ts'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'scripts/generate-android-looks.mjs'
      - 'src/styles.css'
      - 'src/lib/look.ts'
      - 'src/lib/theme.ts'

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

  play-internal:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: android-play-internal
      cancel-in-progress: false
      queue: max
    steps:
      # Builds can finish out of order, even though publishing is serialized.
      - name: Skip superseded Play builds
        id: publish-check
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&per_page=100")
          newer_ids=$(jq -r --argjson current "$GITHUB_RUN_NUMBER" '.workflow_runs[] | select(.run_number > $current) | .id' <<< "$runs")
          for run_id in $newer_ids; do
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100")
            if jq -se 'any(.[] | .jobs[]; .name == "play-internal" and .conclusion == "success")' <<< "$jobs" > /dev/null; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping this build: newer Android run $run_id already published successfully."
              exit 0
            fi
          done
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - if: steps.publish-check.outputs.publish == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - if: steps.publish-check.outputs.publish == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.publish-check.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Validate publishing secrets and decode signing key
        if: steps.publish-check.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"

      - name: Build signed app bundle
        if: steps.publish-check.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/play-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease -PversionName="internal.$VERSION_CODE" -PversionCode="$VERSION_CODE"

      - name: Publish to Google Play internal testing
        if: steps.publish-check.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.parallelcode.phone
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          tracks: internal
          status: completed

      - name: Remove signing key
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -f "$RUNNER_TEMP/play-upload.jks"

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # A signed build must not restore caches that other workflow runs wrote.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/parallel-code-phone-$VERSION.apk"

      # Not marked latest, so the desktop auto-updater keeps finding the desktop release.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Android ${{ github.ref_name }}
          files: ${{ runner.temp }}/parallel-code-phone-*.apk
          make_latest: 'false'

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
